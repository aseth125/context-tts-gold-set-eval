<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>ContextTTS — Prosody Annotation</title>
<style>
  :root{--bg:#fbfbfa;--fg:#1a1a19;--mut:#6b6b68;--line:#e3e3e0;--acc:#2b6cb0;--warn:#c05621}
  *{box-sizing:border-box}
  body{margin:0;font:15px/1.55 -apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif;background:var(--bg);color:var(--fg)}
  header{position:sticky;top:0;background:var(--bg);border-bottom:1px solid var(--line);padding:10px 20px;display:flex;gap:14px;align-items:center;z-index:10}
  .bar{flex:1;height:6px;background:var(--line);border-radius:3px;overflow:hidden}
  .bar>div{height:100%;background:var(--acc);width:0;transition:width .2s}
  main{max-width:860px;margin:0 auto;padding:22px 20px 90px}
  h2{font-size:13px;text-transform:uppercase;letter-spacing:.07em;color:var(--mut);margin:26px 0 8px;font-weight:600}
  h3{font-size:15px;margin:20px 0 6px}
  .card{background:#fff;border:1px solid var(--line);border-radius:8px;padding:16px}
  .turn{margin:3px 0}
  .spk{display:inline-block;min-width:22px;font-weight:700;color:var(--mut)}
  .target{background:#fffbe8;border:1px solid #f0e2a8;border-radius:8px;padding:14px 16px;font-size:17px}
  .intent dt{font-weight:600;margin-top:8px;font-size:13px;color:var(--mut)}
  .intent dd{margin:2px 0 0}
  .clip{display:flex;align-items:center;gap:12px;border:1px solid var(--line);border-radius:8px;padding:10px 12px;margin:8px 0;background:#fff;cursor:pointer}
  .clip:hover{border-color:var(--acc)}
  .clip.sel{border-color:var(--acc);background:#f0f6fc;box-shadow:0 0 0 1px var(--acc)}
  .tag{font-weight:700;width:22px;text-align:center}
  audio{height:34px;flex:1;min-width:0}
  .brk{font-size:12px;color:var(--mut);white-space:nowrap;display:flex;align-items:center;gap:4px}
  .row{display:flex;gap:8px;flex-wrap:wrap;margin-top:6px}
  .chip{border:1px solid var(--line);border-radius:20px;padding:6px 14px;cursor:pointer;background:#fff;font-size:14px}
  .chip.sel{border-color:var(--acc);background:var(--acc);color:#fff}
  footer{position:fixed;bottom:0;left:0;right:0;background:#fff;border-top:1px solid var(--line);padding:10px 20px;display:flex;gap:10px;justify-content:center;align-items:center}
  button{font:inherit;padding:8px 18px;border-radius:6px;border:1px solid var(--line);background:#fff;cursor:pointer}
  button.primary{background:var(--acc);color:#fff;border-color:var(--acc)}
  button:disabled{opacity:.4;cursor:not-allowed}
  .muted{color:var(--mut);font-size:13px}
  .wrap{max-width:760px;margin:40px auto;padding:0 20px}
  input[type=text]{font:inherit;padding:8px 10px;border:1px solid var(--line);border-radius:6px;width:230px}
  .do{background:#f3f9f4;border-left:3px solid #2f855a;padding:10px 14px;margin:8px 0;border-radius:0 6px 6px 0}
  .dont{background:#fdf5f2;border-left:3px solid var(--warn);padding:10px 14px;margin:8px 0;border-radius:0 6px 6px 0}
  ol.steps>li{margin:8px 0}
  table{border-collapse:collapse;width:100%;font-size:14px;margin:8px 0}
  td,th{border:1px solid var(--line);padding:7px 10px;text-align:left;vertical-align:top}
  th{background:#f4f4f2;font-size:13px}
  #modal{position:fixed;inset:0;background:rgba(0,0,0,.45);z-index:50;overflow:auto;padding:30px 12px}
  #modal .inner{background:#fff;max-width:800px;margin:0 auto;border-radius:10px;padding:6px 30px 30px}
</style>
</head>
<body>

<!-- ══════════════════ GUIDELINES (also reachable mid-task) ══════════════════ -->
<template id="guide">
<h1 style="font-size:22px">Annotation guidelines</h1>

<p>You will work through a series of short conversation excerpts. In each one, a
single <b>target line</b> has been picked out. You will hear five synthetic
versions of that line. <b>All five say exactly the same words.</b> They differ
only in <i>how</i> the words are spoken — the tone, the emphasis, the rhythm.</p>

<p><b>Your job:</b> choose the version that is delivered the way the line should
be delivered at that moment in the conversation.</p>

<h3>How to work through a trial</h3>
<ol class="steps">
  <li>Read the <b>conversation so far</b> so you know what is going on.</li>
  <li>Read the <b>target line</b> and the note describing <b>what it should convey</b>.</li>
  <li>Play the <b>original human recording</b>. This is how a real person actually
      said the line in that moment — your anchor for what the delivery should
      express. It is a different voice from the synthetic clips, so listen for
      the <i>manner</i>, not the voice.</li>
  <li>Play <b>all five</b> synthetic clips before deciding. Replay as often as you like.</li>
  <li>Choose the one whose delivery best fits, then set your confidence.</li>
</ol>

<h3>Judge the delivery, and only the delivery</h3>
<div class="do"><b>Do</b> attend to: tone and attitude, which word is emphasised,
pacing and pauses, whether the voice rises or falls, how much energy is behind it.</div>
<div class="dont"><b>Do not</b> pick a clip because it sounds more natural, more
human, or better quality. Every clip comes from the same synthetic voice, and
audio quality is not what is being tested. If a clip sounds broken, tick the
<b>broken</b> box next to it — that is recorded separately and does not affect
your choice.</div>
<div class="dont"><b>Do not</b> compare the words. All five clips are the same
sentence. If one seems to say something different, tick <b>broken</b> for it.</div>

<h3>What "the right delivery" means</h3>
<p>It depends on what the note above the clips says the line should convey:</p>
<table>
  <tr><th>If the note describes…</th><th>Listen for…</th></tr>
  <tr><td>a <b>speech act</b> — e.g. agreement, a check, sarcasm, a correction</td>
      <td>whether it sounds like that act. Is it a genuine question or a flat
          statement? Sincere or mocking? Firmly agreeing, or just noises of
          acknowledgement?</td></tr>
  <tr><td><b>information structure</b> — key words marked GIVEN / NEW / CONTRASTIVE</td>
      <td>which word carries the weight. NEW and CONTRASTIVE words should stand
          out clearly; GIVEN words should be thrown away — quick, quiet,
          unstressed, because they were already mentioned.</td></tr>
  <tr><td>an <b>emotion</b> — e.g. amused, disgusted, awed, sleepy</td>
      <td>whether the feeling comes through, and at roughly the right strength.</td></tr>
</table>

<h3>Confidence</h3>
<table>
  <tr><td><b>high</b></td><td>One clip is clearly right.</td></tr>
  <tr><td><b>medium</b></td><td>Fairly sure, but another was close.</td></tr>
  <tr><td><b>low</b></td><td>Essentially guessing between two or more.</td></tr>
</table>
<p class="muted">Please use <b>low</b> honestly when you mean it. A truthful "low"
is genuinely useful data; it tells us the item is hard, which is something we
need to know. It is not a failure on your part.</p>

<h3>Common situations</h3>
<div class="do"><b>None of them sound right.</b> Pick the closest and mark
confidence <b>low</b>. Do not skip the trial.</div>
<div class="do"><b>Two sound identical.</b> Pick either and mark <b>low</b>.</div>
<div class="do"><b>You change your mind.</b> Use <b>Back</b> and re-answer at any
time; your latest answer is the one kept.</div>

<h3>Practicalities</h3>
<ul>
  <li>There is no feedback and no score. There is no penalty for a wrong answer,
      so please answer honestly rather than cautiously.</li>
  <li>Headphones in a quiet room, please. Laptop speakers hide exactly the
      differences that matter here.</li>
  <li>Your progress saves automatically in this browser. You can close the tab
      and pick up where you left off, using the same annotator ID.</li>
  <li>It takes roughly 60–90 minutes. Please take breaks — fatigue shows up in
      this kind of listening task.</li>
  <li>When you finish, press <b>Download CSV</b> and send us the file. You can
      download at any point, not only at the end.</li>
</ul>
</template>

<!-- ══════════════════════════════ START SCREEN ═════════════════════════════ -->
<div id="gate" class="wrap">
  <div id="guideHost"></div>
  <hr style="margin:28px 0;border:none;border-top:1px solid var(--line)">
  <p><label><b>Your annotator ID</b> (initials are fine — use the same one every session):<br>
     <input id="aid" type="text" placeholder="e.g. as"></label></p>
  <p><button class="primary" onclick="start()">Begin</button></p>
</div>

<header id="hdr" hidden>
  <span class="muted" id="pos"></span>
  <div class="bar"><div id="fill"></div></div>
  <span class="muted" id="who"></span>
  <button onclick="showGuide()">Guidelines</button>
  <button onclick="exportCSV()">Download CSV</button>
</header>

<main id="app" hidden></main>

<footer id="ftr" hidden>
  <button onclick="go(-1)" id="prev">← Back</button>
  <button class="primary" onclick="go(1)" id="next">Next →</button>
</footer>

<div id="modal" hidden><div class="inner">
  <p style="text-align:right;margin:10px 0 0"><button onclick="hideGuide()">Close</button></p>
  <div id="modalBody"></div>
  <p style="text-align:center"><button class="primary" onclick="hideGuide()">Back to the task</button></p>
</div></div>

<script>
let TRIALS=[], I=0, AID="", R={};

document.getElementById("guideHost").appendChild(
  document.getElementById("guide").content.cloneNode(true));

function showGuide(){
  const m=document.getElementById("modalBody");
  m.innerHTML=""; m.appendChild(document.getElementById("guide").content.cloneNode(true));
  document.getElementById("modal").hidden=false;
}
function hideGuide(){document.getElementById("modal").hidden=true}

// ── seeded shuffle: clip order differs per annotator, reproducible from the id ──
function hash(s){let h=2166136261;for(let i=0;i<s.length;i++){h^=s.charCodeAt(i);h=Math.imul(h,16777619)}return h>>>0}
function rng(seed){return function(){seed|=0;seed=seed+0x6D2B79F5|0;let t=Math.imul(seed^seed>>>15,1|seed);t=t+Math.imul(t^t>>>7,61|t)^t;return((t^t>>>14)>>>0)/4294967296}}
function shuffle(arr,seed){const a=arr.slice(),r=rng(seed);for(let i=a.length-1;i>0;i--){const j=Math.floor(r()*(i+1));[a[i],a[j]]=[a[j],a[i]]}return a}

const KEY=()=>"ctts_"+AID;
function save(){localStorage.setItem(KEY(),JSON.stringify({aid:AID,i:I,r:R}))}
function load(){try{return JSON.parse(localStorage.getItem(KEY()))}catch(e){return null}}

async function start(){
  AID=document.getElementById("aid").value.trim().toLowerCase();
  if(!AID){alert("Please enter an annotator ID.");return}
  TRIALS=await (await fetch("trials.json")).json();
  TRIALS=shuffle(TRIALS,hash(AID+"|order"));
  const prev=load(); if(prev&&prev.r){R=prev.r;I=prev.i||0}
  document.getElementById("gate").hidden=true;
  for(const id of ["hdr","app","ftr"])document.getElementById(id).hidden=false;
  document.getElementById("who").textContent=AID;
  render();
}

function esc(s){return (s||"").replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]))}
function order(t){return shuffle(t.clips,hash(AID+"|"+t.trial_id))}

function render(){
  const t=TRIALS[I], r=R[t.trial_id]||{choice:null,confidence:null,broken:[]};
  const ord=order(t), L="ABCDE";

  let ctx=t.context.map(c=>`<div class="turn"><span class="spk">${esc(c.speaker)}:</span> ${esc(c.text)}</div>`).join("");
  if(!ctx)ctx='<div class="muted">(no prior context)</div>';

  const it=t.intent||{}; let dl="";
  if(it.what_it_should_be) dl+=`<dt>Intended</dt><dd>${esc(it.what_it_should_be)}</dd>`;
  if(it.words&&it.words.length) dl+=`<dt>Key words</dt><dd>${it.words.map(w=>`<b>${esc(w.word)}</b> — ${esc(w.label)}`).join(" &nbsp;·&nbsp; ")}</dd>`;
  if(it.why) dl+=`<dt>Why</dt><dd>${esc(it.why)}</dd>`;
  if(it.trigger) dl+=`<dt>Triggered by</dt><dd>${esc(it.trigger)}</dd>`;
  if(it.why_delivery_matters) dl+=`<dt>Why the delivery matters</dt><dd>${esc(it.why_delivery_matters)}</dd>`;
  if(it.why_context_matters) dl+=`<dt>Why context matters</dt><dd>${esc(it.why_context_matters)}</dd>`;
  if(it.expected_delivery) dl+=`<dt>Expected delivery</dt><dd>${esc(it.expected_delivery)}</dd>`;

  const clips=ord.map((f,k)=>`
    <div class="clip ${r.choice===f?"sel":""}" onclick="pick('${f}')">
      <span class="tag">${L[k]}</span>
      <audio controls preload="none" src="audio/${f}" onclick="event.stopPropagation()"></audio>
      <label class="brk" onclick="event.stopPropagation()">
        <input type="checkbox" ${r.broken.includes(f)?"checked":""} onchange="brk('${f}',this.checked)"> broken
      </label>
    </div>`).join("");

  document.getElementById("app").innerHTML=`
    <h2>Conversation so far</h2><div class="card">${ctx}</div>
    <h2>Target line — spoken by ${esc(t.target_speaker||"?")}</h2>
    <div class="target">${esc(t.target_text)}</div>
    <h2>What this line should convey</h2><div class="card intent"><dl style="margin:0">${dl}</dl></div>
    ${t.reference_clip?`<h2>Original human recording</h2>
      <div class="card"><audio controls preload="none" src="audio/${t.reference_clip}" style="width:100%"></audio>
      <div class="muted" style="margin-top:6px">A different voice — listen for the manner, not the voice.</div></div>`:""}
    <h2>Which synthetic version delivers it correctly?</h2>
    ${clips}
    <h2>How confident are you?</h2>
    <div class="row">${["low","medium","high"].map(c=>
      `<div class="chip ${r.confidence===c?"sel":""}" onclick="conf('${c}')">${c}</div>`).join("")}</div>
  `;
  document.getElementById("pos").textContent=`${I+1} / ${TRIALS.length}`;
  document.getElementById("fill").style.width=(100*Object.keys(R).filter(k=>R[k].choice).length/TRIALS.length)+"%";
  document.getElementById("prev").disabled=I===0;
  document.getElementById("next").disabled=!(r.choice&&r.confidence);
  document.getElementById("next").textContent=I===TRIALS.length-1?"Finish":"Next →";
  window.scrollTo(0,0);
}

function cur(){const t=TRIALS[I];R[t.trial_id]=R[t.trial_id]||{choice:null,confidence:null,broken:[],t0:Date.now()};return R[t.trial_id]}
function pick(f){const r=cur();r.choice=f;r.ms=Date.now()-(r.t0||Date.now());save();render()}
function conf(c){cur().confidence=c;save();render()}
function brk(f,on){const r=cur();r.broken=on?[...new Set([...r.broken,f])]:r.broken.filter(x=>x!==f);save()}

function go(d){
  if(d>0&&I===TRIALS.length-1){
    exportCSV();
    alert("All done — thank you.\n\nA CSV has been downloaded. Please send it back to us.");
    return;
  }
  I=Math.max(0,Math.min(TRIALS.length-1,I+d));save();render();
}

// ── CSV export ──────────────────────────────────────────────────────────────
function csvCell(v){
  const s=(v===null||v===undefined)?"":String(v);
  return /[",\n]/.test(s) ? '"'+s.replace(/"/g,'""')+'"' : s;
}
function rows(){
  return TRIALS.filter(t=>R[t.trial_id]&&R[t.trial_id].choice).map(t=>{
    const r=R[t.trial_id], ord=order(t);
    return {
      annotator:AID, trial_id:t.trial_id, item_id:t.item_id, axis:t.axis,
      target_text:t.target_text,
      chosen_clip:r.choice,
      chosen_position:"ABCDE"[ord.indexOf(r.choice)],
      presented_order:ord.join("|"),
      confidence:r.confidence,
      broken_clips:(r.broken||[]).join("|"),
      n_broken:(r.broken||[]).length,
      response_ms:r.ms||"",
      exported_at:new Date().toISOString()
    };
  });
}
function exportCSV(){
  const rs=rows();
  if(!rs.length){alert("Nothing answered yet.");return}
  const cols=Object.keys(rs[0]);
  const csv=[cols.join(",")].concat(rs.map(r=>cols.map(c=>csvCell(r[c])).join(","))).join("\n");
  dl(new Blob([ "﻿"+csv ],{type:"text/csv;charset=utf-8"}),`ctts_annotations_${AID}.csv`);
}
function dl(blob,name){
  const a=document.createElement("a");
  a.href=URL.createObjectURL(blob); a.download=name; a.click();
  setTimeout(()=>URL.revokeObjectURL(a.href),1000);
}
</script>
</body>
</html>
